name: 🤖 Kimi AI全自动实现（新文件创建）

on:
  issue_comment:
    types: [created]

jobs:
  ai-implement:
    if: contains(github.event.comment.body, '@kimi-bot create') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 获取Issue完整上下文
        id: issue_context
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const title = issue.data.title.replace(/"/g, '\\"');
            const body = (issue.data.body || '').replace(/"/g, '\\"');
            
            core.setOutput('issue_title_b64', Buffer.from(title).toString('base64'));
            core.setOutput('issue_body_b64', Buffer.from(body).toString('base64'));
      
      - name: 解析需求指令
        id: parse
        run: |
          # ✅ 使用单引号防止变量提前展开
          FULL_COMMENT='${{ github.event.comment.body }}'
          echo "📝 原始指令: $FULL_COMMENT"
          
          # 清理评论
          CLEAN_COMMENT=$(echo "$FULL_COMMENT" | sed 's/@kimi-bot create//gi' | sed 's/```//g')
          
          # ✅ 改进的路径解析（移除引号）
          OUTPUT_PATH=$(echo "$CLEAN_COMMENT" | grep -oP 'o[:：]\s*\K[^ ]+' | head -1 | sed 's/["'\'']//g')
          if [ -n "$OUTPUT_PATH" ]; then
            echo "OUTPUT_PATH=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
            echo "🎯 输出根目录: $OUTPUT_PATH"
          else
            echo "OUTPUT_PATH=./kimi-created" >> "$GITHUB_OUTPUT"
          fi
          
          # ✅ 提取补充指令
          COMMENT_INSTRUCTION=$(echo "$CLEAN_COMMENT" | sed 's/o[:：]\s*[^ ]\+//g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          
          # ✅ 关键修复：使用中间变量避免嵌套引号问题
          COMMENT_INSTRUCTION_B64=$(printf '%s' "$COMMENT_INSTRUCTION" | base64 -w0)
          echo "COMMENT_INSTRUCTION_B64=$COMMENT_INSTRUCTION_B64" >> "$GITHUB_OUTPUT"
      
      - name: Kimi生成文件结构
        id: ai
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          # ✅ 安全解码
          ISSUE_TITLE=$(printf '%s' '${{ steps.issue_context.outputs.issue_title_b64 }}' | base64 -d)
          ISSUE_BODY=$(printf '%s' '${{ steps.issue_context.outputs.issue_body_b64 }}' | base64 -d)
          COMMENT_INSTRUCTION=$(printf '%s' '${{ steps.parse.outputs.COMMENT_INSTRUCTION_B64 }}' | base64 -d)
          OUTPUT_PATH="${{ steps.parse.outputs.OUTPUT_PATH }}"
          
          # ✅ 使用jq构建JSON避免引号问题
          USER_CONTENT=$(jq -n \
            --arg title "$ISSUE_TITLE" \
            --arg body "$ISSUE_BODY" \
            --arg comment "$COMMENT_INSTRUCTION" \
            --arg output "$OUTPUT_PATH" \
            '{
              "issue_title": $title,
              "issue_body": $body,
              "comment_instruction": $comment,
              "output_path": $output,
              "requirements": "根据以上信息生成文件结构，返回JSON数组：[{\"path\": \"相对路径\", \"content\": \"代码\"}]"
            }' | jq -c .)
          
          PAYLOAD=$(jq -n \
            --arg model "kimi-k2-0905-preview" \
            --arg prompt "$USER_CONTENT" \
            '{
              "model": $model,
              "messages": [
                {"role": "system", "content": "你是资深工程师，严格返回JSON数组，无markdown。"},
                {"role": "user", "content": $prompt}
              ],
              "temperature": 0.2
            }')
          
          # API调用和后续处理...
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.moonshot.cn/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          # ✅ 保存响应
          mkdir -p kimi
          echo "$RESPONSE_BODY" > "kimi/response_create_${{ github.event.issue.number }}_$(date +%Y%m%d_%H%M%S).json"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API失败，状态码: $HTTP_CODE"
            exit 1
          fi
          
          AI_RESPONSE=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty')
          FILE_COUNT=$(echo "$AI_RESPONSE" | jq 'length')
          
          # ✅ 关键修复：使用printf保存base64
          AI_RESPONSE_B64=$(printf '%s' "$AI_RESPONSE" | base64 -w0)
          echo "AI_RESPONSE_B64=$AI_RESPONSE_B64" >> "$GITHUB_OUTPUT"
          echo "FILE_COUNT=$FILE_COUNT" >> "$GITHUB_OUTPUT"
      
      - name: 创建文件结构
        run: |
          # ✅ 安全解码
          AI_RESPONSE=$(printf '%s' '${{ steps.ai.outputs.AI_RESPONSE_B64 }}' | base64 -d)
          OUTPUT_PATH="${{ steps.parse.outputs.OUTPUT_PATH }}"
          
          # 冲突检测（改进版）
          CONFLICTS=$(echo "$AI_RESPONSE" | jq -r '.[].path' | while read path; do
            FULL_PATH="${OUTPUT_PATH%/}/$path"
            [ -f "$FULL_PATH" ] && echo "$FULL_PATH"
          done)
          
          if [ -n "$CONFLICTS" ]; then
            echo "❌ 文件已存在:"
            echo "$CONFLICTS"
            exit 1
          fi
          
          # ✅ 创建文件（使用jq -r安全提取）
          echo "$AI_RESPONSE" | jq -c '.[]' | while IFS= read -r item; do
            FILE_PATH=$(echo "$item" | jq -r '.path')
            CONTENT=$(echo "$item" | jq -r '.content')
            FULL_PATH="${OUTPUT_PATH%/}/$FILE_PATH"
            
            mkdir -p "$(dirname "$FULL_PATH")"
            printf '%s' "$CONTENT" > "$FULL_PATH"
            echo "✅ 创建: $FULL_PATH"
          done
      
      - name: 创建Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🚀 Kimi实现: ${{ github.event.issue.title }}"
          body: |
            ## Kimi AI自动实现结果
            
            **原始Issue**: #${{ github.event.issue.number }}
            **需求描述**: ${{ github.event.issue.title }}
            **触发指令**: ${{ github.event.comment.body }}
            **生成文件数**: ${{ steps.ai.outputs.FILE_COUNT }}个
            **输出目录**: `${{ steps.parse.outputs.OUTPUT_PATH }}`
            
            ---
            ### 📋 使用说明
            1. 点击 [Files changed](...) 查看代码
            2. 如需调整，评论 `@kimi-bot revise 新要求`
            3. 满意后点 **"Merge pull request"**
          branch: kimibot/create-${{ github.event.issue.number }}-${{ github.run_id }}
          labels: kimi-created, automated
          assignees: ${{ github.event.comment.user.login }}
          commit-message: "feat: Kimi自动实现 #${{ github.event.issue.number }}"
