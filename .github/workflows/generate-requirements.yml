name: 🔧 Kimi生成依赖文件

on:
  issue_comment:
    types: [created]

jobs:
  generate-requirements:
    if: contains(github.event.comment.body, '@kimi-bot generate-requirements')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Kimi生成版本锁定依赖
        id: ai
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          INSTRUCTION=$(echo "${{ github.event.comment.body }}" | sed 's/@kimi-bot generate-requirements//g')
          PROMPT="请根据需求生成Python依赖文件。每行格式：包名==版本号。返回纯文本。\n\n需求：$INSTRUCTION"
          
          RESPONSE=$(curl -s https://api.moonshot.cn/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"moonshot-v1-8k\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"每行一个包名==版本号，不要解释。\"},
                {\"role\": \"user\", \"content\": \"$PROMPT\"}
              ]
            }")
          
          echo "$RESPONSE" | jq -r '.choices[0].message.content' > requirements-ai.txt
          echo "TOTAL_LINES=$(wc -l < requirements-ai.txt)" >> $GITHUB_OUTPUT
      
      - name: 测试安装
        run: pip install -r requirements-ai.txt
      
      - name: 创建Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🔧 生成requirements-ai.txt（版本锁定）"
          body: |
            ## Kimi生成的版本锁定依赖文件
            
            **触发**: ${{ github.event.comment.body }}
            **包数量**: ${{ steps.ai.outputs.TOTAL_LINES }} 个
            
            使用方法:
            ```bash
            pip install -r requirements-ai.txt
            ```
            
            如需更新，重新评论:
            ```
            @kimi-bot generate-requirements 更新pytest，添加black
            ```
          branch: auto/kimi-requirements
          labels: dependencies, kimi-generated
          commit-message: "build: 生成依赖版本锁定文件"
