name: 🤖 Kimi AI全自动优化（多文件支持）

on:
  issue_comment:
    types: [created]

jobs:
  ai-optimize:
    if: contains(github.event.comment.body, '@kimi-bot revise') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 解析多文件输入和输出
        id: parse
        run: |
          FULL_COMMENT="${{ github.event.comment.body }}"
          echo "📝 原始指令: $FULL_COMMENT"
          
          CLEAN_COMMENT=$(echo "$FULL_COMMENT" | sed 's/@kimi-bot optimize//gi' | sed 's/```//g')
          
          # ✅ 解析所有输入路径（逗号分隔）
          INPUT_RAW=$(echo "$CLEAN_COMMENT" | grep -oP 'i[:：]\s*\K[^ ]+' | head -1)
          if [ -z "$INPUT_RAW" ]; then
            echo "❌ 必须指定输入路径，例如: i:src/main.py 或 i:src/*.py"
            exit 1
          fi
          
          # ✅ 展开通配符并收集所有文件
          ALL_FILES=""
          IFS=',' read -ra INPUT_PATHS <<< "$INPUT_RAW"
          for path in "${INPUT_PATHS[@]}"; do
            # 移除路径两边的引号
            path=$(echo "$path" | tr -d '"' | tr -d "'")
            
            if [[ "$path" == *"*"* ]]; then
              # 通配符路径，使用find展开
              MATCHED=$(find . -path "$path" -type f 2>/dev/null || echo "")
              ALL_FILES="$ALL_FILES"$'\n'"$MATCHED"
            elif [ -f "$path" ]; then
              # 单个文件
              ALL_FILES="$ALL_FILES"$'\n'"$path"
            elif [ -d "$path" ]; then
              # 目录，查找所有py文件
              MATCHED=$(find "$path" -name "*.py" -type f 2>/dev/null || echo "")
              ALL_FILES="$ALL_FILES"$'\n'"$MATCHED"
            else
              echo "⚠️  警告: 路径不存在或无法识别: $path"
            fi
          done
          
          # ✅ 去重并限制数量
          UNIQUE_FILES=$(echo "$ALL_FILES" | grep -v '^$' | sort | uniq)
          FILE_COUNT=$(echo "$UNIQUE_FILES" | wc -l)
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ 未找到任何有效文件"
            exit 1
          fi
          
          if [ "$FILE_COUNT" -gt 10 ]; then
            echo "⚠️  警告: 找到 $FILE_COUNT 个文件，最多处理10个，将处理前10个"
            UNIQUE_FILES=$(echo "$UNIQUE_FILES" | head -10)
            FILE_COUNT=10
          fi
          
          echo "FILES_LIST<<EOF" >> "$GITHUB_OUTPUT"
          echo "$UNIQUE_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "FILE_COUNT=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ 将处理 $FILE_COUNT 个文件"
          
          # ✅ 解析输出路径（可选）
          OUTPUT_PATH=$(echo "$CLEAN_COMMENT" | grep -oP 'o[:：]\s*\K[^ ]+' | head -1 | tr -d '`"'"'")
          if [ -n "$OUTPUT_PATH" ]; then
            echo "OUTPUT_PATH=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
            echo "🎯 输出路径: $OUTPUT_PATH"
            
            # 判断输出类型
            if [ -d "$OUTPUT_PATH" ] || [ "${OUTPUT_PATH: -1}" == "/" ]; then
              echo "OUTPUT_MODE=multi" >> "$GITHUB_OUTPUT"  # 批量输出到目录
            else
              echo "OUTPUT_MODE=merge" >> "$GITHUB_OUTPUT"  # 合并输出到单文件
            fi
          else
            echo "OUTPUT_MODE=inline" >> "$GITHUB_OUTPUT"  # 原地修改
            echo "🎯 输出模式: 原地修改"
          fi
          
          # 提取核心指令
          CORE_INSTRUCTION=$(echo "$CLEAN_COMMENT" | sed 's/i[:：]\s*[^ ]\+//g' | sed 's/o[:：]\s*[^ ]\+//g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "CORE_INSTRUCTION_B64=$(echo "$CORE_INSTRUCTION" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "💡 核心指令: '$CORE_INSTRUCTION'"
      
      - name: 读取所有文件内容
        id: current
        run: |
          FILES_LIST='${{ steps.parse.outputs.FILES_LIST }}'
          FILE_COUNT='${{ steps.parse.outputs.FILE_COUNT }}'
          
          # ✅ 构建多文件JSON结构
          echo "FILES_JSON<<EOF" >> "$GITHUB_OUTPUT"
          echo "[" >> "$GITHUB_OUTPUT"
          
          FIRST=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> "$GITHUB_OUTPUT"
            fi
            
            CODE_B64=$(base64 -w0 < "$file" 2>/dev/null || echo "")
            CODE_LEN=$(wc -c < "$file" 2>/dev/null || echo "0")
            
            cat >> "$GITHUB_OUTPUT" <<ITEM
            {
              "path": "$file",
              "size": $CODE_LEN,
              "content_b64": "$CODE_B64"
            }
ITEM
          done <<< "$FILES_LIST"
          
          echo "]" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "✅ 成功读取 $FILE_COUNT 个文件"
      
      - name: Kimi批量生成优化代码
        id: ai
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          FILES_JSON=$(cat <<'EOF'
          ${{ steps.current.outputs.FILES_JSON }}
          EOF
          )
          
          CORE_INSTRUCTION=$(printf '%s' '${{ steps.parse.outputs.CORE_INSTRUCTION_B64 }}' | base64 -d)
          OUTPUT_MODE="${{ steps.parse.outputs.OUTPUT_MODE }}"
          
          # ✅ 构建多文件Prompt
          PROMPT=$(printf '你将处理 %d 个文件，按以下JSON格式提供内容：\n\n%s\n\n指令：\n%s\n\n' $(echo "$FILES_JSON" | jq 'length') "$FILES_JSON" "$CORE_INSTRUCTION")
          
          # ✅ 根据输出模式追加要求
          if [ "$OUTPUT_MODE" == "inline" ]; then
            PROMPT="$PROMPT 对每个文件进行优化，返回JSON格式： [{\"path\": \"文件路径\", \"content\": \"优化后内容\"}]"
          elif [ "$OUTPUT_MODE" == "multi" ]; then
            PROMPT="$PROMPT 批量处理所有文件，返回JSON格式： [{\"path\": \"输出路径\", \"content\": \"新内容\"}]"
          else
            PROMPT="$PROMPT 合并所有文件内容，生成单一输出文件，只返回内容不返回路径"
          fi
          
          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg model "kimi-k2-0905-preview" \
            '{
              "model": $model,
              "messages": [
                {"role": "system", "content": "你是资深代码专家，严格遵循指令，返回纯内容，不要markdown标记。JSON输出必须合法。"},
                {"role": "user", "content": $prompt}
              ],
              "temperature": 0.3
            }')
          
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.moonshot.cn/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d'
          
          mkdir -p kimi
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          ISSUE_NUM=${{ github.event.issue.number }}
          echo "$RESPONSE_BODY" > "kimi/response_${ISSUE_NUM}_${TIMESTAMP}.json"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API调用失败，状态码: $HTTP_CODE"
            echo "响应内容: $RESPONSE_BODY"
            exit 1
          fi
          
          # ✅ 保存AI响应到输出
          AI_RESPONSE=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty' | sed '/^```/d')
          echo "AI_RESPONSE_B64=$(echo "$AI_RESPONSE" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "✅ Kimi批量处理完成"
      
      - name: 应用AI生成的内容
        run: |
          AI_RESPONSE=$(printf '%s' '${{ steps.ai.outputs.AI_RESPONSE_B64 }}' | base64 -d)
          OUTPUT_MODE="${{ steps.parse.outputs.OUTPUT_MODE }}"
          OUTPUT_PATH="${{ steps.parse.outputs.OUTPUT_PATH }}"
          
          if [ "$OUTPUT_MODE" == "inline" ]; then
            # ✅ 原地修改：解析JSON并更新每个文件
            echo "$AI_RESPONSE" | jq -c '.[]' | while read -r item; do
              FILE_PATH=$(echo "$item" | jq -r '.path')
              CONTENT=$(echo "$item" | jq -r '.content' | sed '/^```/d')
              mkdir -p $(dirname "$FILE_PATH")
              echo "$CONTENT" > "$FILE_PATH"
              echo "✅ 更新: $FILE_PATH"
            done
          elif [ "$OUTPUT_MODE" == "multi" ]; then
            # ✅ 批量输出到目录
            echo "$AI_RESPONSE" | jq -c '.[]' | while read -r item; do
              OUT_PATH=$(echo "$item" | jq -r '.path')
              CONTENT=$(echo "$item" | jq -r '.content' | sed '/^```/d')
              # 如果AI返回的是相对路径，则基于OUTPUT_PATH
              if [[ "$OUT_PATH" != /* ]] && [ -n "$OUTPUT_PATH" ]; then
                OUT_PATH="${OUTPUT_PATH%/}/$OUT_PATH"
              fi
              mkdir -p $(dirname "$OUT_PATH")
              echo "$CONTENT" > "$OUT_PATH"
              echo "✅ 生成: $OUT_PATH"
            done
          else
            # ✅ 合并输出到单文件
            CONTENT=$(echo "$AI_RESPONSE" | sed '/^```/d')
            mkdir -p $(dirname "$OUTPUT_PATH")
            echo "$CONTENT" > "$OUTPUT_PATH"
            echo "✅ 生成合并文件: $OUTPUT_PATH"
          fi
      
      - name: 创建Pull Request（携带原始Issue上下文）
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🤖 Kimi优化: ${{ steps.parse.outputs.FILE_COUNT }}个文件"
          body: |
            ## Kimi AI批量优化结果
            
            **原始Issue**: #${{ github.event.issue.number }}
            **触发指令**: ${{ github.event.comment.body }}
            **处理文件数**: ${{ steps.parse.outputs.FILE_COUNT }}个
            **输出模式**: ${{ steps.parse.outputs.OUTPUT_MODE }}
            
            ---            
            1. 点击 [Files changed](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files) 查看代码
            2. 如需调整，在本PR下评论 `@kimi-bot revise i:文件路径 新要求`
            3. 满意后点 "Merge pull request"
            
            <!-- ORIGINAL_ISSUE_CONTEXT
            ISSUE_NUMBER: ${{ github.event.issue.number }}
            ISSUE_TITLE: ${{ github.event.issue.title }}
            ORIGINAL_COMMENT: ${{ github.event.comment.body }}
            TARGET: ${{ steps.parse.outputs.FILE_COUNT }}个文件
            -->
          branch: kimibot/optimize-${{ github.event.issue.number }}-${{ github.run_id }}
          labels: kimi-optimized, automated
          assignees: ${{ github.event.comment.user.login }}
          commit-message: |
            feat: Kimi批量优化 ${{ steps.parse.outputs.FILE_COUNT }}个文件
