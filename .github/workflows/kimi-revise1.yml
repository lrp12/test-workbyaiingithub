name: 🤖 Kimi AI迭代增强

on:
  issue_comment:
    types: [created]

jobs:
  ai-revise:
    if: contains(github.event.comment.body, '@kimi-bot revise')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      # ==========================================
      # Step 1: ✅ 修复：使用简单表达式
      # ==========================================
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      
      # ==========================================
      # Step 2: 获取PR文件列表
      # ==========================================
      - name: 获取PR文件列表
        id: pr_context
        if: github.event.issue.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            
            const fileList = files.data.map(f => f.filename).join(',');
            core.setOutput('modified_files', fileList);
            core.setOutput('pr_number', pr.data.number);
            core.setOutput('head_ref', pr.data.head.ref);
            
            console.log(`✅ 获取完成: ${files.data.length}个文件`);
      
      # ==========================================
      # Step 3: 解析指令
      # ==========================================
      - name: 解析修改指令
        id: parse
        run: |
          FULL_COMMENT='${{ github.event.comment.body }}'
          CLEAN_COMMENT=$(echo "$FULL_COMMENT" | sed 's/@kimi-bot revise//gi' | sed 's/```//g')
          
          TARGET_FILES=$(echo "$CLEAN_COMMENT" | grep -oP 'i[:：]\s*\K[^ ]+' | head -1)
          if [ -n "$TARGET_FILES" ]; then
            echo "TARGET_FILES=$TARGET_FILES" >> "$GITHUB_OUTPUT"
          else
            echo "TARGET_FILES=${{ steps.pr_context.outputs.modified_files }}" >> "$GITHUB_OUTPUT"
          fi
          
          REVISE_REQ=$(echo "$CLEAN_COMMENT" | sed 's/i[:：]\s*[^ ]\+//g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          REVISE_REQ_B64=$(printf '%s' "$REVISE_REQ" | base64 -w0)
          echo "REVISE_REQ_B64=$REVISE_REQ_B64" >> "$GITHUB_OUTPUT"
      
      # ==========================================
      # Step 4: ✅ 修复：使用printf构建JSON（避免jq循环）
      # ==========================================
      - name: 读取当前文件
        id: current
        run: |
          TARGETS='${{ steps.parse.outputs.TARGET_FILES }}'
          echo "📂 正在读取目标文件: $TARGETS"
          
          # 使用临时文件存储JSON，避免多行变量
          TEMP_JSON=$(mktemp)
          echo "[]" > "$TEMP_JSON"
          
          IFS=',' read -ra PATHS <<< "$TARGETS"
          for path in "${PATHS[@]}"; do
            path=$(echo "$path" | xargs)
            
            if [[ "$path" == *"*"* ]]; then
              MATCHED=$(find . -path "$path" -type f 2>/dev/null || true)
            elif [ -f "$path" ]; then
              MATCHED="$path"
            elif [ -d "$path" ]; then
              MATCHED=$(find "$path" -type f 2>/dev/null || true)
              MATCHED=$(echo "$MATCHED" | grep -vE '(\.git|node_modules|__pycache__)')
            else
              continue
            fi
            
            for file in $MATCHED; do
              [ -z "$file" ] && continue
              CODE_B64=$(base64 -w0 < "$file" 2>/dev/null)
              CODE_LEN=$(wc -c < "$file" 2>/dev/null)
              
              # 追加元素到JSON数组
              jq --arg path "$file" --arg content "$CODE_B64" --argjson size "$CODE_LEN" \
                '. += [{"path": $path, "size": $size, "content_b64": $content}]' \
                "$TEMP_JSON" > "$TEMP_JSON.tmp" && mv "$TEMP_JSON.tmp" "$TEMP_JSON"
            done
          done
          
          # 统计文件数量
          FILE_COUNT=$(jq 'length' "$TEMP_JSON")
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ 未找到任何有效文件"
            exit 1
          fi
          
          if [ "$FILE_COUNT" -gt 10 ]; then
            echo "⚠️  文件数超过10个，仅处理前10个"
            jq '.[0:10]' "$TEMP_JSON" > "$TEMP_JSON.tmp" && mv "$TEMP_JSON.tmp" "$TEMP_JSON"
            FILE_COUNT=10
          fi
          
          # 输出到GitHub Output
          echo "FILES_JSON<<EOF" >> "$GITHUB_OUTPUT"
          cat "$TEMP_JSON" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          
          rm -f "$TEMP_JSON"
          echo "✅ 成功读取 $FILE_COUNT 个文件"
      
      # ==========================================
      # Step 5: Kimi生成
      # ==========================================
      - name: Kimi迭代增强
        id: ai
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          FILES_JSON='${{ steps.current.outputs.FILES_JSON }}'
          PR_FILES='${{ steps.pr_context.outputs.modified_files }}'
          REVISE_REQ=$(printf '%s' '${{ steps.parse.outputs.REVISE_REQ_B64 }}' | base64 -d)
          
          # ✅ 修复：使用单行构建Prompt
          PROMPT="PR文件: $PR_FILES\n目标文件: $FILES_JSON\n需求: $REVISE_REQ\n规则: 优先修改,最多3个新文件"
          
          PAYLOAD=$(jq -n \
            --arg model "kimi-k2-0905-preview" \
            --arg prompt "$PROMPT" \
            '{
              "model": $model,
              "messages": [
                {"role": "system", "content": "你是代码迭代专家。返回JSON数组 [{path, content, action}]。"},
                {"role": "user", "content": $prompt}
              ],
              "temperature": 0.3
            }')
          
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.moonshot.cn/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          mkdir -p kimi
          echo "$RESPONSE_BODY" > "kimi/revise_${{ github.event.issue.number }}_$(date +%Y%m%d_%H%M%S).json"
          
          if [ "$HTTP_CODE" != "200" ]; then exit 1; fi
          
          AI_RESPONSE=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty')
          
          if [ -z "$AI_RESPONSE" ] || ! echo "$AI_RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "❌ AI响应无效"
            exit 1
          fi
          
          NEW_FILE_COUNT=$(echo "$AI_RESPONSE" | jq '[.[] | select(.action == "create")] | length')
          if [ "$NEW_FILE_COUNT" -gt 3 ]; then
            echo "⚠️  新文件数超过限制"
            exit 1
          fi
          
          FILE_COUNT=$(echo "$AI_RESPONSE" | jq 'length')
          AI_RESPONSE_B64=$(printf '%s' "$AI_RESPONSE" | base64 -w0)
          echo "AI_RESPONSE_B64=$AI_RESPONSE_B64" >> "$GITHUB_OUTPUT"
          echo "FILE_COUNT=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "NEW_FILE_COUNT=$NEW_FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ Kimi处理完成，共 $FILE_COUNT 个文件"
      
      # ==========================================
      # Step 6: 应用更改
      # ==========================================
      - name: 应用修改和创建文件
        id: apply
        run: |
          AI_RESPONSE=$(printf '%s' '${{ steps.ai.outputs.AI_RESPONSE_B64 }}' | base64 -d)
          
          MODIFIED_COUNT=0
          CREATED_COUNT=0
          FAILED_COUNT=0
          
          while IFS= read -r item; do
            set +e
            
            FILE_PATH=$(echo "$item" | jq -r '.path')
            CONTENT=$(echo "$item" | jq -r '.content')
            ACTION=$(echo "$item" | jq -r '.action // "modify"')
            
            CLEAN_PATH=$(echo "$FILE_PATH" | sed 's/^\.\///' | sed 's/^\///')
            FULL_PATH="./$CLEAN_PATH"
            
            if [ "$ACTION" == "create" ] && [ -f "$FULL_PATH" ]; then
              echo "❌ 文件已存在: $FULL_PATH"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi
            
            mkdir -p "$(dirname "$FULL_PATH")"
            printf '%s' "$CONTENT" > "$FULL_PATH"
            
            if [ $? -eq 0 ]; then
              if [ "$ACTION" == "create" ]; then
                CREATED_COUNT=$((CREATED_COUNT + 1))
              else
                MODIFIED_COUNT=$((MODIFIED_COUNT + 1))
              fi
            else
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
            
            set -e
          done < <(echo "$AI_RESPONSE" | jq -c '.[]')
          
          echo "MODIFIED_COUNT=$MODIFIED_COUNT" >> "$GITHUB_ENV"
          echo "CREATED_COUNT=$CREATED_COUNT" >> "$GITHUB_ENV"
          echo "FAILED_COUNT=$FAILED_COUNT" >> "$GITHUB_ENV"
          echo "🏁 应用完成：修改 $MODIFIED_COUNT 个，创建 $CREATED_COUNT 个，失败 $FAILED_COUNT 个"
      
      # ==========================================
      # Step 7: ✅ 修复：使用env传递变量
      # ==========================================
      - name: 更新PR描述
        uses: actions/github-script@v7
        with:
          env:
            PR_NUMBER: ${{ steps.pr_context.outputs.pr_number }}
            AI_RESPONSE_B64: ${{ steps.ai.outputs.AI_RESPONSE_B64 }}
            COMMENT_USER: ${{ github.event.comment.user.login }}
            COMMENT_BODY: ${{ github.event.comment.body }}
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER);
            const aiResponse = JSON.parse(Buffer.from(process.env.AI_RESPONSE_B64, 'base64').toString());
            
            const modifiedFiles = aiResponse.filter(f => f.action === 'modify').map(f => f.path);
            const createdFiles = aiResponse.filter(f => f.action === 'create').map(f => f.path);
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const report = [
              '## 🤖 Kimi迭代增强报告',
              '',
              '**触发**: @' + process.env.COMMENT_USER + ' - ' + process.env.COMMENT_BODY,
              '**结果**: 修改 ' + modifiedFiles.length + ' 个，创建 ' + createdFiles.length + ' 个',
              '',
              '**修改**: ' + (modifiedFiles.length ? modifiedFiles.join(', ') : '无'),
              '**新增**: ' + (createdFiles.length ? createdFiles.join(', ') : '无')
            ].join('\n');
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: pr.body + '\n\n---\n' + report
            });
      
      # ==========================================
      # Step 8: ✅ 修复：简化提交步骤
      # ==========================================
      - name: 提交更改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: Kimi迭代增强 #${{ steps.pr_context.outputs.pr_number }}"
          branch: ${{ github.head_ref }}
          file_pattern: "*"
          commit_user_name: kimibot
