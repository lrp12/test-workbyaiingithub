



name: 🤖 Kimi AI迭代增强（修改+新增）

on:
  issue_comment:
    types: [created]

jobs:
  ai-revise:
    if: contains(github.event.comment.body, '@kimi-bot revise')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      # ==========================================
      # Step 1: 检出PR分支（关键修复）
      # ==========================================
      - uses: actions/checkout@v4
        with:
          # ✅ 修复：在PR中触发时检出PR分支
          ref: ${{ github.event.issue.pull_request && format('refs/heads/{0}', github.event.issue.pull_request.head.ref) || github.ref }}
      
      # ==========================================
      # Step 2: 获取PR文件列表（修复JS语法）
      # ==========================================
      - name: 获取PR文件列表
        id: pr_context
        if: github.event.issue.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            // ✅ 修复：使用context和core，避免模板字符串
            const prNumber = context.issue.number;
            console.log(`正在获取PR #${prNumber} 信息...`);
            
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            
            const fileList = files.data.map(f => f.filename).join(',');
            core.setOutput('modified_files', fileList);
            core.setOutput('pr_number', pr.data.number);
            core.setOutput('head_ref', pr.data.head.ref); // ✅ 修复：添加分支信息
            
            console.log(`✅ 获取完成: ${files.data.length}个文件`);
      
      # ==========================================
      # Step 3: 解析用户指令
      # ==========================================
      - name: 解析修改指令
        id: parse
        run: |
          FULL_COMMENT='${{ github.event.comment.body }}'
          echo "📝 修改指令: $FULL_COMMENT"
          
          CLEAN_COMMENT=$(echo "$FULL_COMMENT" | sed 's/@kimi-bot revise//gi' | sed 's/```//g')
          
          TARGET_FILES=$(echo "$CLEAN_COMMENT" | grep -oP 'i[:：]\s*\K[^ ]+' | head -1)
          if [ -n "$TARGET_FILES" ]; then
            echo "TARGET_FILES=$TARGET_FILES" >> "$GITHUB_OUTPUT"
          else
            echo "TARGET_FILES=${{ steps.pr_context.outputs.modified_files }}" >> "$GITHUB_OUTPUT"
          fi
          
          REVISE_REQ=$(echo "$CLEAN_COMMENT" | sed 's/i[:：]\s*[^ ]\+//g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          REVISE_REQ_B64=$(printf '%s' "$REVISE_REQ" | base64 -w0)
          echo "REVISE_REQ_B64=$REVISE_REQ_B64" >> "$GITHUB_OUTPUT"
          echo "💡 修改要求: '$REVISE_REQ'"
      
      # ==========================================
      # Step 4: 读取文件内容（修复YAML缩进）
      # ==========================================
      - name: 读取当前文件
        id: current
        run: |
          TARGETS='${{ steps.parse.outputs.TARGET_FILES }}'
          echo "📂 正在读取目标文件: $TARGETS"
          
          ALL_FILES=""
          IFS=',' read -ra PATHS <<< "$TARGETS"
          
          for path in "${PATHS[@]}"; do
            path=$(echo "$path" | xargs)
            
            if [[ "$path" == *"*"* ]]; then
              MATCHED=$(find . -path "$path" -type f 2>/dev/null || echo "")
              ALL_FILES="$ALL_FILES"$'\n'"$MATCHED"
            elif [ -f "$path" ]; then
              ALL_FILES="$ALL_FILES"$'\n'"$path"
            elif [ -d "$path" ]; then
              echo "⚠️  目录路径，将查找所有类型文件"
              MATCHED=$(find "$path" -type f 2>/dev/null || echo "")
              MATCHED=$(echo "$MATCHED" | grep -vE '(\.git|node_modules|__pycache__)')
              ALL_FILES="$ALL_FILES"$'\n'"$MATCHED"
            else
              echo "⚠️  警告: 路径不存在: $path"
            fi
          done
          
          UNIQUE_FILES=$(echo "$ALL_FILES" | grep -v '^$' | sort | uniq)
          FILE_COUNT=$(echo "$UNIQUE_FILES" | wc -l)
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ 未找到任何有效文件"
            exit 1
          fi
          
          if [ "$FILE_COUNT" -gt 10 ]; then
            echo "⚠️  警告: 文件数超过10个，仅处理前10个"
            UNIQUE_FILES=$(echo "$UNIQUE_FILES" | head -10)
            FILE_COUNT=10
          fi
          
          # ✅ 修复：使用jq构建JSON，避免here-document
          JSON_ARRAY="[]"
          for file in $UNIQUE_FILES; do
            [ -z "$file" ] && continue
            CODE_B64=$(base64 -w0 < "$file" 2>/dev/null)
            CODE_LEN=$(wc -c < "$file" 2>/dev/null)
            JSON_ARRAY=$(echo "$JSON_ARRAY" | jq \
              --arg path "$file" \
              --arg content "$CODE_B64" \
              --argjson size "$CODE_LEN" \
              '. + [{"path": $path, "size": $size, "content_b64": $content}]')
          done
          
          echo "FILES_JSON<<EOF" >> "$GITHUB_OUTPUT"
          echo "$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "✅ 成功读取 $FILE_COUNT 个文件"
      
      # ==========================================
      # Step 5: Kimi生成响应
      # ==========================================
      - name: Kimi迭代增强
        id: ai
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          FILES_JSON='${{ steps.current.outputs.FILES_JSON }}'
          PR_FILES='${{ steps.pr_context.outputs.modified_files }}'
          REVISE_REQ=$(printf '%s' '${{ steps.parse.outputs.REVISE_REQ_B64 }}' | base64 -d)
          
          # ✅ 修复：使用Process Substitution
          PROMPT=$(jq -n \
            --arg pr "$PR_FILES" \
            --arg json "$FILES_JSON" \
            --arg req "$REVISE_REQ" \
            '{
              "message": "你是代码迭代专家。基于PR文件和请求，返回JSON数组。",
              "pr_files": $pr,
              "file_contents": $json,
              "requirement": $req,
              "limit": "最多创建3个新文件"
            }' | jq -c .)
          
          PAYLOAD=$(jq -n \
            --arg model "kimi-k2-0905-preview" \
            --arg prompt "$PROMPT" \
            '{
              "model": $model,
              "messages": [
                {"role": "system", "content": "你是代码迭代专家。严格返回JSON数组 [{path, content, action}]。"},
                {"role": "user", "content": $prompt}
              ],
              "temperature": 0.3
            }')
          
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.moonshot.cn/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          mkdir -p kimi
          echo "$RESPONSE_BODY" > "kimi/revise_${{ github.event.issue.number }}_$(date +%Y%m%d_%H%M%S).json"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API调用失败，状态码: $HTTP_CODE"
            exit 1
          fi
          
          AI_RESPONSE=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty')
          
          if [ -z "$AI_RESPONSE" ]; then
            echo "❌ AI响应为空"
            exit 1
          fi
          
          echo "$AI_RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "❌ AI响应不是有效的JSON数组"
            exit 1
          fi
          
          NEW_FILE_COUNT=$(echo "$AI_RESPONSE" | jq '[.[] | select(.action == "create")] | length')
          if [ "$NEW_FILE_COUNT" -gt 3 ]; then
            echo "⚠️  AI尝试创建 $NEW_FILE_COUNT 个新文件，超过限制（最多3个）"
            exit 1
          fi
          
          FILE_COUNT=$(echo "$AI_RESPONSE" | jq 'length')
          echo "AI_RESPONSE_B64=$(printf '%s' "$AI_RESPONSE" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "FILE_COUNT=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "NEW_FILE_COUNT=$NEW_FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ Kimi处理完成，共 $FILE_COUNT 个文件（其中 $NEW_FILE_COUNT 个新文件）"
      
      # ==========================================
      # Step 6: 应用更改
      # ==========================================
      - name: 应用修改和创建文件
        id: apply
        run: |
          AI_RESPONSE=$(printf '%s' '${{ steps.ai.outputs.AI_RESPONSE_B64 }}' | base64 -d)
          
          MODIFIED_COUNT=0
          CREATED_COUNT=0
          FAILED_COUNT=0
          
          while IFS= read -r item; do
            set +e
            
            FILE_PATH=$(echo "$item" | jq -r '.path')
            CONTENT=$(echo "$item" | jq -r '.content')
            ACTION=$(echo "$item" | jq -r '.action // "modify"')
            
            CLEAN_PATH=$(echo "$FILE_PATH" | sed 's/^\.\///' | sed 's/^\///')
            FULL_PATH="./$CLEAN_PATH"
            
            if [ "$ACTION" == "create" ] && [ -f "$FULL_PATH" ]; then
              echo "❌ 安全拦截：尝试创建已存在的文件 $FULL_PATH"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi
            
            mkdir -p "$(dirname "$FULL_PATH")"
            printf '%s' "$CONTENT" > "$FULL_PATH"
            
            if [ $? -eq 0 ]; then
              if [ "$ACTION" == "create" ]; then
                echo "✅ 创建: $FULL_PATH"
                CREATED_COUNT=$((CREATED_COUNT + 1))
              else
                echo "✅ 修改: $FULL_PATH"
                MODIFIED_COUNT=$((MODIFIED_COUNT + 1))
              fi
            else
              echo "❌ 写入失败: $FULL_PATH"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
            
            set -e
          done < <(echo "$AI_RESPONSE" | jq -c '.[]')
          
          echo "MODIFIED_COUNT=$MODIFIED_COUNT" >> "$GITHUB_ENV"
          echo "CREATED_COUNT=$CREATED_COUNT" >> "$GITHUB_ENV"
          echo "FAILED_COUNT=$FAILED_COUNT" >> "$GITHUB_ENV"
          echo "🏁 应用完成：修改 $MODIFIED_COUNT 个，创建 $CREATED_COUNT 个，失败 $FAILED_COUNT 个"
      
      # ==========================================
      # Step 7: 更新PR描述（修复JS语法）
      # ==========================================
      - name: 更新PR描述
        uses: actions/github-script@v7
        with:
          # ✅ 修复：通过env传递所有变量
          env:
            MODIFIED_COUNT: ${{ env.MODIFIED_COUNT }}
            CREATED_COUNT: ${{ env.CREATED_COUNT }}
            AI_RESPONSE_B64: ${{ steps.ai.outputs.AI_RESPONSE_B64 }}
            COMMENT_BODY: ${{ github.event.comment.body }}
            COMMENT_USER: ${{ github.event.comment.user.login }}
            PR_NUMBER: ${{ steps.pr_context.outputs.pr_number }}
          script: |
            // ✅ 修复：使用process.env获取变量
            const modifiedCount = parseInt(process.env.MODIFIED_COUNT || '0');
            const createdCount = parseInt(process.env.CREATED_COUNT || '0');
            const prNumber = parseInt(process.env.PR_NUMBER);
            
            const aiResponse = JSON.parse(
              Buffer.from(process.env.AI_RESPONSE_B64, 'base64').toString()
            );
            
            const modifiedFiles = aiResponse
              .filter(f => f.action === 'modify')
              .map(f => f.path);
            const createdFiles = aiResponse
              .filter(f => f.action === 'create')
              .map(f => f.path);
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            // ✅ 修复：使用字符串拼接而非模板字符串
            const timestamp = new Date().toLocaleString('zh-CN');
            const enhanceReport = [
              '## 🤖 Kimi迭代增强报告（' + timestamp + '）',
              '',
              '**触发指令**: @' + process.env.COMMENT_USER + ' 说: "' + process.env.COMMENT_BODY + '"',
              '**执行结果**: ✅ 修改 ' + modifiedCount + ' 个文件，➕ 创建 ' + createdCount + ' 个新文件',
              '',
              '---',
              '',
              '### 📝 修改的文件',
              (modifiedFiles.length > 0 ? modifiedFiles.map(f => '- ' + f).join('\n') : '（无）'),
              '',
              '### ➕ 创建的新文件',
              (createdFiles.length > 0 ? createdFiles.map(f => '- ' + f + ' ⚠️ 新').join('\n') : '（无）'),
              '',
              '---',
              'ℹ️ 由 @' + process.env.COMMENT_USER + ' 通过 `@kimi-bot revise` 触发'
            ].join('\n');
            
            // ✅ 更新PR描述
            const newBody = pr.body + '\n\n---\n' + enhanceReport;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newBody
            });
            
            console.log('✅ 更新PR描述成功');
      
      # ==========================================
      # Step 8: 提交到PR分支
      # ==========================================
      - name: 提交更改到PR
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: Kimi迭代增强 #${{ steps.pr_context.outputs.pr_number }}"
          # ✅ 修复：使用github.head_ref获取当前分支
          branch: ${{ github.head_ref }}
          file_pattern: "*"
          commit_user_name: kimibot
          commit_user_email: kimibot@github-actions.local
