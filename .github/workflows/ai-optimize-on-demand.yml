name: 🤖 Kimi AI全自动优化

on:
  issue_comment:
    types: [created]

jobs:
  ai-optimize:
    if: contains(github.event.comment.body, '@kimi-bot optimize')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    
    steps:
      - uses: actions/checkout@v4
      
      # ✅ 修复1：确保依赖文件存在
      - name: 确保依赖文件存在（防缓存报错）
        run: |
          if [ ! -f "requirements-ai.txt" ]; then
            echo "# AI工作流依赖（自动生成）" > requirements-ai.txt
            echo "# 占位文件，将被自动扫描更新" >> requirements-ai.txt
            echo "pytest==7.4.3" >> requirements-ai.txt
            echo "radon==6.0.1" >> requirements-ai.txt
          fi
      
      - name: 设置Python环境并启用缓存
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ai.txt
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements-ai.txt
      
      # ✅ 修复2：使用更安全的方式解析指令
      - name: 解析优化指令
        id: parse
        run: |
          # 移除触发词并清理
          CLEAN_COMMENT=$(echo "${{ github.event.comment.body }}" | sed 's/@kimi-bot optimize//gi')
          # 提取文件路径（支持中文冒号和多种格式）
          FILE_NAME=$(echo "$CLEAN_COMMENT" | grep -oP '文件[:：]\s*\K[^\s]+' | head -1 || echo "src/main.py")
          # 清理文件名中的反引号
          FILE_NAME=$(echo "$FILE_NAME" | tr -d '`')
          
          echo "INSTRUCTION<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CLEAN_COMMENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "TARGET_FILE=$FILE_NAME" >> "$GITHUB_OUTPUT"
          
          echo "📄 目标文件: $FILE_NAME"
      
      - name: 读取待优化代码
        id: current
        run: |
          if [ -f "${{ steps.parse.outputs.TARGET_FILE }}" ]; then
            echo "CODE_EXISTS=true" >> "$GITHUB_OUTPUT"
            # 安全编码内容
            CODE=$(cat "${{ steps.parse.outputs.TARGET_FILE }}" | base64)
            echo "CODE=$CODE" >> "$GITHUB_OUTPUT"
            echo "✅ 找到文件: ${{ steps.parse.outputs.TARGET_FILE }}"
          else
            echo "CODE_EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ 文件不存在: ${{ steps.parse.outputs.TARGET_FILE }}"
          fi
      
      # ✅ 修复3：关键改进 - 使用jq构建JSON并修正API端点
      - name: Kimi生成优化代码
        id: ai
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          # 解码指令和代码
          INSTRUCTION=$(echo "${{ steps.parse.outputs.INSTRUCTION }}" | base64 -d)
          TARGET_FILE="${{ steps.parse.outputs.TARGET_FILE }}"
          
          # 构建提示词（base64编码防止特殊字符问题）
          if [ "${{ steps.current.outputs.CODE_EXISTS }}" == "true" ]; then
            CODE=$(echo "${{ steps.current.outputs.CODE }}" | base64 -d)
            PROMPT=$(printf "基于以下代码优化：\n\n%s\n\n要求：\n%s\n\n直接返回代码，不要解释。" "$CODE" "$INSTRUCTION" | base64)
          else
            PROMPT=$(printf "根据要求生成代码：\n\n%s\n\n直接返回代码。" "$INSTRUCTION" | base64)
          fi
          
          # ✅ 修复：正确的API端点 + 使用jq构建JSON
          PAYLOAD=$(echo '{}' | jq --arg model "kimi-k2-0905-preview" --arg prompt "$PROMPT" '{
            "model": $model,
            "messages": [
              {"role": "system", "content": "你是资深代码专家，返回纯代码，不要markdown标记。"},
              {"role": "user", "content": $prompt | @base64d}
            ],
            "temperature": 0.3
          }')
          
          # 调用API并保存完整响应
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.moonshot.cn/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          # 分离响应体和状态码
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          # ✅ 新增：保存原始响应到kimi文件夹
          mkdir -p kimi
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          ISSUE_NUM=${{ github.event.issue.number }}
          echo "$RESPONSE_BODY" > "kimi/response_${ISSUE_NUM}_${TIMESTAMP}.json"
          echo "💾 原始响应已保存: kimi/response_${ISSUE_NUM}_${TIMESTAMP}.json"
          
          # 错误处理
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API调用失败，状态码: $HTTP_CODE"
            echo "响应内容: $RESPONSE_BODY"
            exit 1
          fi
          
          # ✅ 修复：正确解析content字段
          OPTIMIZED_CODE=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty')
          
          # 检查是否为null或空
          if [ -z "$OPTIMIZED_CODE" ] || [ "$OPTIMIZED_CODE" == "null" ]; then
            echo "⚠️ 警告: 未从响应中获取到有效代码"
            echo "完整响应: $RESPONSE_BODY"
            OPTIMIZED_CODE="# 未能生成有效代码，请检查日志"
          fi
          
          # 保存代码输出
          echo "OPTIMIZED_CODE<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OPTIMIZED_CODE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      
      - name: 创建/更新目标文件
        run: |
          TARGET_FILE="${{ steps.parse.outputs.TARGET_FILE }}"
          mkdir -p $(dirname "$TARGET_FILE")
          echo "${{ steps.ai.outputs.OPTIMIZED_CODE }}" > "$TARGET_FILE"
          echo "✅ 文件已更新: $TARGET_FILE"
      
      # ✅ 修复4：确保脚本存在
      - name: 确保更新脚本存在
        run: |
          mkdir -p .ai
          if [ ! -f ".ai/update_requirements.py" ]; then
            cat > .ai/update_requirements.py << 'EOF'
          import os
          import sys
          import argparse
          
          def main():
            parser = argparse.ArgumentParser()
            parser.add_argument('--scan-path', required=True)
            parser.add_argument('--output', required=True)
            args = parser.parse_args()
            
            # 简单的依赖扫描逻辑
            deps = ["pytest==7.4.3", "radon==6.0.1"]
            with open(args.output, 'w') as f:
              f.write("# AI工作流依赖（自动生成）\\n")
              for dep in deps:
                f.write(f"{dep}\\n")
            print(f"✅ 依赖文件已更新: {args.output}")
          
          if __name__ == "__main__":
            main()
          EOF
          fi
      
      - name: 扫描并更新requirements.txt
        id: deps
        run: |
          python .ai/update_requirements.py --scan-path . --output requirements-ai.txt
          if [ -n "$(git status --porcelain requirements-ai.txt)" ]; then
            echo "DEP_UPDATED=true" >> "$GITHUB_OUTPUT"
            echo "📦 依赖已更新"
          else
            echo "DEP_UPDATED=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: 创建Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🤖 Kimi优化: ${{ steps.parse.outputs.TARGET_FILE }}"
          body: |
            ## Kimi AI优化结果
            
            **触发指令**: ${{ github.event.comment.body }}
            **目标文件**: `${{ steps.parse.outputs.TARGET_FILE }}`
            ${{ steps.deps.outputs.DEP_UPDATED == 'true' && '\n**依赖更新**: requirements-ai.txt 已自动更新' || '' }}
            
            1. 点击 [Files changed](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files) 查看代码
            2. 如需调整，在本PR下评论 `@kimi-bot revise <新要求>`
            3. 满意后点 "Merge pull request"
          branch: kimibot/optimize-${{ github.event.issue.number }}-${{ github.run_id }}
          labels: kimi-optimized, automated
          assignees: ${{ github.event.comment.user.login }}
          commit-message: |
            feat: Kimi优化 ${{ steps.parse.outputs.TARGET_FILE }}
            ${{ steps.deps.outputs.DEP_UPDATED == 'true' && '\nbuild: 自动更新依赖' || '' }}