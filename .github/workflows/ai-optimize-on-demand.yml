
name: 🤖 Kimi AI按需优化

on:
  issue_comment:
    types: [created, edited]

jobs:
  ai-optimize:
    if: contains(github.event.comment.body, '@kimi-bot optimize')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置Python环境并启用缓存
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ai.txt
      
      - name: 安装依赖（版本锁定）
        run: |
          pip install --upgrade pip
          pip install -r requirements-ai.txt
      
      - name: 解析你的优化指令
        id: parse
        run: |
          INSTRUCTION=$(echo "${{ github.event.comment.body }}" | sed 's/@kimi-bot optimize//g' | sed 's/```//g')
          echo "INSTRUCTION<<EOF" >> $GITHUB_OUTPUT
          echo "$INSTRUCTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          FILE_NAME=$(echo "$INSTRUCTION" | grep -oP '文件[:：]\s*\K[\w\/]+\.py' || echo "src/main.py")
          echo "TARGET_FILE=$FILE_NAME" >> $GITHUB_OUTPUT
      
      - name: 读取待优化代码
        id: current
        run: |
          if [ -f "${{ steps.parse.outputs.TARGET_FILE }}" ]; then
            CODE=$(cat "${{ steps.parse.outputs.TARGET_FILE }}")
            echo "CODE_EXISTS=true" >> $GITHUB_OUTPUT
            echo "CODE<<EOF" >> $GITHUB_OUTPUT
            echo "$CODE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CODE_EXISTS=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Kimi生成优化代码
        id: ai
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          if [ "${{ steps.current.outputs.CODE_EXISTS }}" == "true" ]; then
            PROMPT="基于以下代码优化：\n\n${{ steps.current.outputs.CODE }}\n\n要求：\n${{ steps.parse.outputs.INSTRUCTION }}\n\n直接返回代码，不要解释。"
          else
            PROMPT="根据要求生成代码：\n\n${{ steps.parse.outputs.INSTRUCTION }}\n\n直接返回代码。"
          fi
          
          RESPONSE=$(curl -s https://api.moonshot.cn/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"moonshot-v1-8k\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"你是资深代码专家，返回纯代码，不要markdown标记。\"},
                {\"role\": \"user\", \"content\": \"$PROMPT\"}
              ],
              \"temperature\": 0.3
            }")
          
          CODE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          echo "OPTIMIZED_CODE<<EOF" >> $GITHUB_OUTPUT
          echo "$CODE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 创建/更新文件
        run: |
          mkdir -p $(dirname "${{ steps.parse.outputs.TARGET_FILE }}")
          echo "${{ steps.ai.outputs.OPTIMIZED_CODE }}" > "${{ steps.parse.outputs.TARGET_FILE }}"
      
      - name: 创建Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🤖 Kimi优化: ${{ steps.parse.outputs.TARGET_FILE }}"
          body: |
            ## Kimi AI优化结果
            
            **触发指令**: ${{ github.event.comment.body }}
            **目标文件**: `${{ steps.parse.outputs.TARGET_FILE }}`
            
            1. 点击 [Files changed](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files) 查看代码
            2. 如需调整，在本PR下评论 `@kimi-bot revise <新要求>`
            3. 满意后点 "Merge pull request"
          branch: kimibot/optimize-${{ github.event.issue.number }}-${{ github.run_id }}
          labels: kimi-optimized, automated
          assignees: ${{ github.event.comment.user.login }}

