name: 🤖 Kimi AI全自动优化与修订

on:
  issue_comment:
    types: [created]

jobs:
  ai-optimize:
    if: contains(github.event.comment.body, '@kimi-bot optimize') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 确保依赖文件存在
        run: |
          if [ ! -f "requirements-ai.txt" ]; then
            echo "# AI工作流依赖（自动生成）" > requirements-ai.txt
            echo "# 占位文件，将被自动扫描更新" >> requirements-ai.txt
            echo "pytest==7.4.3" >> requirements-ai.txt
            echo "radon==6.0.1" >> requirements-ai.txt
          fi
      
      - name: 设置Python环境并启用缓存
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ai.txt
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements-ai.txt
      
      - name: 解析优化指令（智能识别文件）
        id: parse
        run: |
          CLEAN_COMMENT=$(echo "${{ github.event.comment.body }}" | sed 's/@kimi-bot optimize//gi' | sed 's/```//g')
          INSTRUCTION=$(echo "$CLEAN_COMMENT" | sed '/文件[:：]/d')
          
          # ✅ 智能文件识别逻辑
          if echo "$CLEAN_COMMENT" | grep -qP '文件夹[:：]\s*\K[^\s]+'; then
            # 情况1: 用户指定文件夹（批量处理）
            FOLDER=$(echo "$CLEAN_COMMENT" | grep -oP '文件夹[:：]\s*\K[^\s]+' | head -1 | tr -d '`')
            FILES=$(find "$FOLDER" -name "*.py" -type f 2>/dev/null || echo "")
            if [ -z "$FILES" ]; then
              echo "❌ 文件夹不存在或无Python文件: $FOLDER"
              exit 1
            fi
            echo "FILES_LIST<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "MODE=folder" >> "$GITHUB_OUTPUT"
            echo "📁 批量处理文件夹: $FOLDER"
          elif echo "$CLEAN_COMMENT" | grep -qP '文件[:：]\s*\K[^\s]+'; then
            # 情况2: 用户指定文件
            FILE_NAME=$(echo "$CLEAN_COMMENT" | grep -oP '文件[:：]\s*\K[^\s]+' | head -1 | tr -d '`')
            echo "TARGET_FILE=$FILE_NAME" >> "$GITHUB_OUTPUT"
            echo "MODE=file" >> "$GITHUB_OUTPUT"
            echo "📄 指定目标文件: $FILE_NAME"
          else
            # 情况3: 自动检测（优化场景）
            if [ -f "src/main.py" ]; then
              FILE_NAME="src/main.py"
            elif [ -f "main.py" ]; then
              FILE_NAME="main.py"
            else
              FILE_NAME=$(find . -name "*.py" -not -path "./.*" -not -path "./venv/*" -not -path "./.venv/*" -not -path "./kimi/*" | head -1 | sed 's|^\./||')
            fi
            echo "TARGET_FILE=${FILE_NAME:-src/main.py}" >> "$GITHUB_OUTPUT"
            echo "MODE=file" >> "$GITHUB_OUTPUT"
            echo "🔍 自动检测目标文件: ${FILE_NAME:-src/main.py}"
          fi
          
          echo "INSTRUCTION_B64=$(echo "$INSTRUCTION" | base64 -w0)" >> "$GITHUB_OUTPUT"
      
      - name: 读取待优化代码（支持批量）
        id: current
        run: |
          MODE="${{ steps.parse.outputs.MODE }}"
          
          if [ "$MODE" == "folder" ]; then
            # 批量读取文件夹内所有文件
            FILES_LIST='${{ steps.parse.outputs.FILES_LIST }}'
            echo "CODE_EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "FILES_LIST_B64=$(echo "$FILES_LIST" | base64 -w0)" >> "$GITHUB_OUTPUT"
            echo "✅ 批量模式，准备处理 $(echo "$FILES_LIST" | wc -l) 个文件"
          else
            # 单文件模式
            TARGET_FILE="${{ steps.parse.outputs.TARGET_FILE }}"
            if [ -f "$TARGET_FILE" ]; then
              CODE_B64=$(base64 -w0 < "$TARGET_FILE")
              echo "CODE_EXISTS=true" >> "$GITHUB_OUTPUT"
              echo "CODE_B64=$CODE_B64" >> "$GITHUB_OUTPUT"
              echo "✅ 找到文件: $TARGET_FILE"
            else
              echo "CODE_EXISTS=false" >> "$GITHUB_OUTPUT"
              echo "⚠️ 文件不存在: $TARGET_FILE"
            fi
          fi
      
      - name: Kimi生成优化代码
        id: ai
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          INSTRUCTION=$(printf '%s' '${{ steps.parse.outputs.INSTRUCTION_B64 }}' | base64 -d)
          CODE_EXISTS="${{ steps.current.outputs.CODE_EXISTS }}"
          MODE="${{ steps.parse.outputs.MODE }}"
          
          if [ "$MODE" == "folder" ]; then
            # 批量处理（简化版：处理第一个文件，后续可扩展循环）
            FILES_LIST=$(printf '%s' '${{ steps.current.outputs.FILES_LIST_B64 }}' | base64 -d)
            FIRST_FILE=$(echo "$FILES_LIST" | head -1)
            if [ -f "$FIRST_FILE" ]; then
              CODE=$(base64 -w0 < "$FIRST_FILE" | base64 -d)
              PROMPT=$(printf '批量处理文件夹，优先优化此文件：\n\n%s\n\n要求：\n%s\n\n直接返回代码，不要解释。' "$CODE" "$INSTRUCTION")
              echo "TARGET_FILE=$FIRST_FILE" >> "$GITHUB_OUTPUT"
            else
              PROMPT=$(printf '根据要求生成代码：\n\n%s\n\n直接返回代码。' "$INSTRUCTION")
            fi
          elif [ "$CODE_EXISTS" == "true" ]; then
            CODE=$(printf '%s' '${{ steps.current.outputs.CODE_B64 }}' | base64 -d)
            PROMPT=$(printf '基于以下代码优化：\n\n%s\n\n要求：\n%s\n\n直接返回代码，不要解释。' "$CODE" "$INSTRUCTION")
          else
            PROMPT=$(printf '根据要求生成代码：\n\n%s\n\n直接返回代码。' "$INSTRUCTION")
          fi
          
          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg model "kimi-k2-0905-preview" \
            '{
              "model": $model,
              "messages": [
                {"role": "system", "content": "你是资深代码专家，返回纯代码，不要markdown标记。"},
                {"role": "user", "content": $prompt}
              ],
              "temperature": 0.3
            }')
          
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.moonshot.cn/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          mkdir -p kimi
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          ISSUE_NUM=${{ github.event.issue.number }}
          echo "$RESPONSE_BODY" > "kimi/response_${ISSUE_NUM}_${TIMESTAMP}.json"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API调用失败，状态码: $HTTP_CODE"
            echo "响应内容: $RESPONSE_BODY"
            exit 1
          fi
          
          OPTIMIZED_CODE=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty' | sed '/^```/d' | base64 -w0)
          echo "OPTIMIZED_CODE_B64=$OPTIMIZED_CODE" >> "$GITHUB_OUTPUT"
      
      - name: 创建/更新目标文件
        run: |
          TARGET_FILE="${{ steps.parse.outputs.TARGET_FILE }}"
          MODE="${{ steps.parse.outputs.MODE }}"
          
          if [ "$MODE" == "folder" ]; then
            # TODO: 扩展批量写入逻辑（当前简化处理）
            FILES_LIST=$(printf '%s' '${{ steps.current.outputs.FILES_LIST_B64 }}' | base64 -d)
            FIRST_FILE=$(echo "$FILES_LIST" | head -1)
            printf '%s' '${{ steps.ai.outputs.OPTIMIZED_CODE_B64 }}' | base64 -d > "$FIRST_FILE"
            echo "✅ 批量模式 - 已更新第一个文件: $FIRST_FILE"
          else
            mkdir -p $(dirname "$TARGET_FILE")
            printf '%s' '${{ steps.ai.outputs.OPTIMIZED_CODE_B64 }}' | base64 -d > "$TARGET_FILE"
            echo "✅ 文件已生成/更新: $TARGET_FILE"
          fi
      
      - name: 确保更新脚本存在
        run: |
          mkdir -p .ai
          if [ ! -f ".ai/update_requirements.py" ]; then
            cat > .ai/update_requirements.py << 'EOF'
          #!/usr/bin/env python3
          """
          智能依赖扫描脚本
          自动分析Python文件中的import语句，更新requirements-ai.txt
          """
          import os
          import re
          import sys
          import argparse
          from pathlib import Path
          from datetime import datetime

          # Python标准库列表（用于过滤）
          STANDARD_LIBS = {
              'os', 'sys', 'time', 'datetime', 'json', 're', 'math', 'random', 'string',
              'pathlib', 'subprocess', 'threading', 'multiprocessing', 'collections',
              'itertools', 'functools', 'typing', 'inspect', 'hashlib', 'base64',
              'csv', 'io', 'pickle', 'sqlite3', 'uuid', 'warnings', 'logging',
              'argparse', 'configparser', 'html', 'http', 'urllib', 'ftplib',
              'smtplib', 'email', 'xml', 'zipfile', 'tarfile', 'gzip', 'bz2',
              'lzma', 'shutil', 'tempfile', 'mimetypes', 'getpass', 'secrets',
              'hmac', 'ssl', 'socket', 'select', 'asyncio', 'concurrent', 'ctypes',
              'decimal', 'fractions', 'numbers', 'statistics', 'enum', 'dataclasses',
              'contextlib', 'pprint', 'textwrap', 'fnmatch', 'glob', 'linecache',
              'traceback', 'cProfile', 'profile', 'pstats', 'timeit', 'trace'
          }

          # 常见第三方库及其推荐版本
          COMMON_PACKAGES = {
              'requests': 'requests>=2.31.0',
              'pytest': 'pytest==7.4.3',
              'radon': 'radon==6.0.1',
              'numpy': 'numpy>=1.24.0',
              'pandas': 'pandas>=2.0.0',
              'beautifulsoup4': 'beautifulsoup4>=4.12.0',
              'lxml': 'lxml>=4.9.0',
              'scrapy': 'scrapy>=2.9.0',
              'selenium': 'selenium>=4.10.0',
              'flask': 'flask>=2.3.0',
              'django': 'django>=4.2.0',
              'fastapi': 'fastapi>=0.100.0',
              'pydantic': 'pydantic>=2.0.0',
              'sqlalchemy': 'sqlalchemy>=2.0.0',
          }

          def extract_imports(file_path):
              """从Python文件中提取所有import的库"""
              imports = set()
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # 匹配 import xxx
                  import_matches = re.findall(r'^\s*import\s+([a-zA-Z_][a-zA-Z0-9_]*)\s*', content, re.MULTILINE)
                  imports.update(import_matches)
                  
                  # 匹配 from xxx import
                  from_matches = re.findall(r'^\s*from\s+([a-zA-Z_][a-zA-Z0-9_]*)\s+import', content, re.MULTILINE)
                  imports.update(from_matches)
                  
              except Exception as e:
                  print(f"⚠️  读取文件失败 {file_path}: {e}", file=sys.stderr)
              
              return imports

          def scan_directory(scan_path):
              """扫描目录下所有Python文件"""
              all_imports = set()
              python_files = list(Path(scan_path).rglob("*.py"))
              
              print(f"🔍 扫描Python文件: 找到 {len(python_files)} 个文件")
              
              for py_file in python_files:
                  # 跳过虚拟环境、缓存和隐藏目录
                  if any(skip in str(py_file) for skip in ['.git', '__pycache__', 'venv', '.venv', '.ai', 'kimi']):
                      continue
                  
                  imports = extract_imports(py_file)
                  if imports:
                      print(f"  📄 {py_file.relative_to(scan_path)}: {', '.join(imports)}")
                  all_imports.update(imports)
              
              return all_imports

          def filter_third_party(imports):
              """过滤出第三方库"""
              third_party = []
              for imp in imports:
                  if imp not in STANDARD_LIBS and not imp.startswith('_'):
                      third_party.append(imp)
              return sorted(third_party)

          def generate_requirements(third_party_libs, output_file):
              """生成requirements文件"""
              lines = [
                  "# AI工作流依赖（自动生成）",
                  f"# 更新时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}",
                  ""
              ]
              
              for lib in third_party_libs:
                  # 如果有预设版本，使用预设；否则只写库名
                  if lib in COMMON_PACKAGES:
                      lines.append(COMMON_PACKAGES[lib])
                  else:
                      lines.append(lib)
              
              # 写入文件
              with open(output_file, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(lines))
              
              print(f"\n✅ 依赖文件已更新: {output_file}")
              print(f"📦 检测到 {len(third_party_libs)} 个第三方库:")
              for lib in third_party_libs:
                  print(f"   - {lib}")

          def main():
              parser = argparse.ArgumentParser(description='智能扫描Python依赖')
              parser.add_argument('--scan-path', required=True, help='要扫描的目录路径')
              parser.add_argument('--output', required=True, help='输出的requirements文件路径')
              args = parser.parse_args()
              
              if not os.path.isdir(args.scan_path):
                  print(f"❌ 错误: 扫描路径不存在 - {args.scan_path}", file=sys.stderr)
                  sys.exit(1)
              
              print(f"📂 开始扫描目录: {args.scan_path}")
              
              # 1. 扫描所有import
              all_imports = scan_directory(args.scan_path)
              print(f"\n📊 总计发现 {len(all_imports)} 个不同的 import")
              
              # 2. 过滤第三方库
              third_party = filter_third_party(all_imports)
              
              if not third_party:
                  print("⚠️  未检测到需要的外部依赖")
                  return
              
              # 3. 生成requirements文件
              generate_requirements(third_party, args.output)

          if __name__ == '__main__':
              main()
          EOF
          fi
      
      - name: 扫描并更新依赖
        id: deps
        run: |
          chmod +x .ai/update_requirements.py
          python .ai/update_requirements.py --scan-path . --output requirements-ai.txt
          if [ -n "$(git status --porcelain requirements-ai.txt)" ]; then
            echo "DEP_UPDATED=true" >> "$GITHUB_OUTPUT"
            echo "📦 依赖已更新"
          else
            echo "DEP_UPDATED=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: 创建Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🤖 Kimi优化: ${{ steps.parse.outputs.TARGET_FILE }}"
          body: |
            ## Kimi AI优化结果
            
            **触发指令**: ${{ github.event.comment.body }}
            **目标文件**: `${{ steps.parse.outputs.TARGET_FILE }}`
            ${{ steps.deps.outputs.DEP_UPDATED == 'true' && '\n**依赖更新**: requirements-ai.txt 已自动更新' || '' }}
            
            1. 点击 [Files changed](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files) 查看代码
            2. 如需调整，在本PR下评论 `@kimi-bot revise <新要求>`
            3. 满意后点 "Merge pull request"
          branch: kimibot/optimize-${{ github.event.issue.number }}-${{ github.run_id }}
          labels: kimi-optimized, automated
          assignees: ${{ github.event.comment.user.login }}
          commit-message: |
            feat: Kimi优化 ${{ steps.parse.outputs.TARGET_FILE }}
            ${{ steps.deps.outputs.DEP_UPDATED == 'true' && '\nbuild: 自动更新依赖' || '' }}

  ai-revise:
    if: contains(github.event.comment.body, '@kimi-bot revise') && github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.issue.pull_request.head.ref }}
      
      - name: 确保依赖文件存在
        run: |
          if [ ! -f "requirements-ai.txt" ]; then
            echo "# AI工作流依赖（自动生成）" > requirements-ai.txt
            echo "# 占位文件，将被自动扫描更新" >> requirements-ai.txt
            echo "pytest==7.4.3" >> requirements-ai.txt
            echo "radon==6.0.1" >> requirements-ai.txt
          fi
      
      - name: 设置Python环境并启用缓存
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ai.txt
      
      - name: 安装依赖
        run: pip install --upgrade pip && pip install -r requirements-ai.txt
      
      - name: 解析修订指令（智能识别）
        id: parse
        run: |
          # ✅ 添加调试输出
          echo "📝 原始评论: ${{ github.event.comment.body }}"
          
          CLEAN_COMMENT=$(echo "${{ github.event.comment.body }}" | sed 's/@kimi-bot revise//gi' | sed 's/```//g')
          echo "清理后评论: '$CLEAN_COMMENT'"
          
          INSTRUCTION=$(echo "$CLEAN_COMMENT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "提取指令: '$INSTRUCTION'"
          
          # 智能文件识别函数
          get_smart_file() {
            # 优先级1: 用户指定文件
            USER_FILE=$(echo "$CLEAN_COMMENT" | grep -oP '文件[:：]\s*\K[^\s]+' | head -1 | tr -d '`')
            if [ -n "$USER_FILE" ] && [ -f "$USER_FILE" ]; then
              echo "$USER_FILE"
              echo "检测模式: 用户指定" >> /dev/stderr
              return 0
            fi
            
            # 优先级2: 用户指定文件夹（TODO: 扩展批量处理）
            USER_FOLDER=$(echo "$CLEAN_COMMENT" | grep -oP '文件夹[:：]\s*\K[^\s]+' | head -1 | tr -d '`')
            if [ -n "$USER_FOLDER" ]; then
              FIRST_PY=$(find "$USER_FOLDER" -name "*.py" -type f -not -path "*/\.*" | head -1)
              if [ -n "$FIRST_PY" ]; then
                echo "$FIRST_PY"
                echo "检测模式: 用户指定文件夹" >> /dev/stderr
                return 0
              fi
            fi
            
            # 优先级3: PR中最近修改的文件
            if [ -n "${{ github.event.issue.pull_request.base.sha }}" ]; then
              CHANGED_FILE=$(git diff --name-only ${{ github.event.issue.pull_request.base.sha }}...HEAD | grep '\.py$' | head -1)
              if [ -n "$CHANGED_FILE" ] && [ -f "$CHANGED_FILE" ]; then
                echo "$CHANGED_FILE"
                echo "检测模式: PR变更" >> /dev/stderr
                return 0
              fi
            fi
            
            # 优先级4: 工作区最近修改的文件
            RECENT_FILE=$(find . -name "*.py" -type f -not -path "./.*" -not -path "./venv/*" -not -path "./.venv/*" -not -path "./kimi/*" -mmin -10080 | head -1 | sed 's|^\./||')
            if [ -n "$RECENT_FILE" ]; then
              echo "$RECENT_FILE"
              echo "检测模式: 最近修改" >> /dev/stderr
              return 0
            fi
            
            # 优先级5: 默认文件
            if [ -f "src/main.py" ]; then
              echo "src/main.py"
              echo "检测模式: 默认src/main.py" >> /dev/stderr
            elif [ -f "main.py" ]; then
              echo "main.py"
              echo "检测模式: 默认main.py" >> /dev/stderr
            else
              # 最终手段：任意Python文件
              ANY_PY=$(find . -name "*.py" -type f -not -path "./.*" -not -path "./venv/*" -not -path "./.venv/*" -not -path "./kimi/*" | head -1 | sed 's|^\./||')
              if [ -n "$ANY_PY" ]; then
                echo "$ANY_PY"
                echo "检测模式: 首个可用文件" >> /dev/stderr
              else
                echo "❌ 错误: 无法找到任何Python文件" >> /dev/stderr
                return 1
              fi
            fi
          }
          
          # 执行智能检测
          FILE_NAME=$(get_smart_file)
          if [ $? -ne 0 ] || [ -z "$FILE_NAME" ]; then
            echo "❌ 致命错误: 无法确定目标文件"
            exit 1
          fi
          
          echo "最终目标文件: $FILE_NAME"
          echo "TARGET_FILE=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "MODE=file" >> "$GITHUB_OUTPUT"
          echo "INSTRUCTION_B64=$(echo "$INSTRUCTION" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
      
      - name: 读取当前代码
        id: current
        run: |
          TARGET_FILE="${{ steps.parse.outputs.TARGET_FILE }}"
          
          if [ -z "$TARGET_FILE" ]; then
            echo "❌ 致命错误: TARGET_FILE为空"
            exit 1
          fi
          
          if [ ! -f "$TARGET_FILE" ]; then
            echo "❌ 文件不存在: $TARGET_FILE"
            echo "当前目录结构:"
            find . -name "*.py" -type f -not -path "./.*" -not -path "./venv/*" -not -path "./.venv/*" -not -path "./kimi/*" | head -20
            exit 1
          fi
          
          CODE_B64=$(base64 -w0 < "$TARGET_FILE")
          echo "CODE_B64=$CODE_B64" >> "$GITHUB_OUTPUT"
          echo "✅ 成功读取文件: $TARGET_FILE ($(wc -c < "$TARGET_FILE") 字节)"
      
      - name: Kimi生成修订代码
        id: ai
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          CODE=$(printf '%s' '${{ steps.current.outputs.CODE_B64 }}' | base64 -d)
          INSTRUCTION=$(printf '%s' '${{ steps.parse.outputs.INSTRUCTION_B64 }}' | base64 -d)
          PROMPT=$(printf '基于以下代码进行修订：\n\n%s\n\n修订要求：\n%s\n\n直接返回完整的修订后代码，不要解释。' "$CODE" "$INSTRUCTION")
          
          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg model "kimi-k2-0905-preview" \
            '{
              "model": $model,
              "messages": [
                {"role": "system", "content": "你是资深代码专家，返回纯代码，不要markdown标记。"},
                {"role": "user", "content": $prompt}
              ],
              "temperature": 0.3
            }')
          
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.moonshot.cn/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          mkdir -p kimi
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          ISSUE_NUM=${{ github.event.issue.number }}
          RESPONSE_FILE="kimi/revise_response_${ISSUE_NUM}_${TIMESTAMP}.json"
          echo "$RESPONSE_BODY" > "$RESPONSE_FILE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API调用失败，状态码: $HTTP_CODE"
            exit 1
          fi
          
          OPTIMIZED_CODE=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty' | sed '/^```/d' | base64 -w0)
          echo "OPTIMIZED_CODE_B64=$OPTIMIZED_CODE" >> "$GITHUB_OUTPUT"
      
      - name: 更新文件
        run: |
          TARGET_FILE="${{ steps.parse.outputs.TARGET_FILE }}"
          printf '%s' '${{ steps.ai.outputs.OPTIMIZED_CODE_B64 }}' | base64 -d > "$TARGET_FILE"
          echo "✅ 文件已更新: $TARGET_FILE"
      
      - name: 扫描并更新依赖
        id: deps
        run: |
          chmod +x .ai/update_requirements.py
          python .ai/update_requirements.py --scan-path . --output requirements-ai.txt
          if [ -n "$(git status --porcelain requirements-ai.txt)" ]; then
            echo "DEP_UPDATED=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEP_UPDATED=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: 提交修订到当前PR
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "🤖 Kimi修订: ${{ steps.parse.outputs.TARGET_FILE }} (${{ github.event.comment.id }})" || echo "无更改"
          git push
      
      - name: 添加修订反馈评论
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const filePath = '${{ steps.parse.outputs.TARGET_FILE }}';
            const depUpdated = '${{ steps.deps.outputs.DEP_UPDATED }}' === 'true';
            const depInfo = depUpdated ? '\n**依赖更新**: requirements-ai.txt 已自动更新' : '';
            const body = `## 🤖 Kimi修订完成\n\n**修订文件**: \`${filePath}\`\n**修订指令**: 已处理\n${depInfo}\n\n✅ 代码已更新并提交到本PR分支。`;
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });